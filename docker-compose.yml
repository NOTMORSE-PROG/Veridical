services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veridical
      POSTGRES_PASSWORD: veridical
      POSTGRES_DB: veridical
    # Host port 5433: dev machines often run a native Postgres on 5432
    # (the owner's does), which silently shadows the container from the
    # host side. Inside the compose network the API still uses db:5432.
    ports:
      - "5433:5432"
    volumes:
      - veridical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridical -d veridical"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://veridical:veridical@db:5432/veridical
      # Fake-LLM by default: compose runs burn zero quota and need no keys.
      VERIDICAL_FAKE_LLM: ${VERIDICAL_FAKE_LLM:-1}
      VERIDICAL_ENV: ${VERIDICAL_ENV:-dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # V-052 (BYOK): omitted here previously -- BYOK_ENCRYPTION_KEY being
      # set in the host's .env silently never reached the container, so
      # the feature read as "unavailable on this deployment" even when a
      # developer had genuinely configured it (ux-critic finding, P1,
      # live-reproduced: GET /settings returned byok_available:false
      # through the container, true against a process reading .env
      # directly). Blank default matches every other optional secret here.
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-}
    # BUG-032: data_dir (config.py, default "./data" -> /srv/veridical/data
    # per the Dockerfile's WORKDIR) is a real on-disk cache the pipeline
    # reads on every check-run, not just at ingestion — without this, every
    # container recreate silently strands manuscripts the DB still thinks
    # are fine.
    #
    # BUG-031: `docker compose up` (no `--build`) reused whatever image
    # was last built, with no doc warning and no way to tell the running
    # container predates the current source tree — a real, hit-live
    # reproducibility gap (a verification pass reviewed a stale image and
    # nearly reported a real endpoint as missing). Bind-mounting the
    # source and running uvicorn with `--reload` (below) means dev source
    # edits are served immediately, with no rebuild step to forget — the
    # image only goes stale on a genuine `pyproject.toml`/`uv.lock`
    # dependency change, the same case every Python dev container has.
    volumes:
      - ./backend/data:/srv/veridical/data
      - ./backend/app:/srv/veridical/app
      - ./backend/alembic:/srv/veridical/alembic
      - ./backend/alembic.ini:/srv/veridical/alembic.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  veridical-pgdata:
