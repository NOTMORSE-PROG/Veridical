name: Production mobile browser verification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: production-mobile-smoke
  cancel-in-progress: false

jobs:
  mobile-smoke:
    # BUG-236: keep scheduled/manual runs visibly skipped until durable R2 and
    # the dedicated synthetic fixture are provisioned. A skipped job is not
    # acceptance evidence; G25R clears only after this flag is true and the
    # exact deployed revision passes.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PROD_MOBILE_ENABLED == 'true'
    environment:
      name: production-mobile-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/mobile-smoke/package-lock.json

      - name: Install verification dependencies
        working-directory: tools/mobile-smoke
        run: npm ci --ignore-scripts

      - name: Run verification policy tests
        working-directory: tools/mobile-smoke
        run: npm test

      - name: Install pinned Chromium runtime
        working-directory: tools/mobile-smoke
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build the checked-out frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          env -u VITE_API_BASE_URL npm run build

      - name: Warm the public production API
        run: node tools/mobile-smoke/warm-production.mjs

      - name: Verify production bytes before authentication
        run: node tools/mobile-smoke/verify-deployment.mjs frontend/dist

      - name: Run authenticated touch-emulation journey
        id: mobile
        working-directory: tools/mobile-smoke
        env:
          PROD_SMOKE_CHECK_RUN_ID: ${{ vars.PROD_SMOKE_CHECK_RUN_ID }}
          PROD_SMOKE_FLAG_ID: ${{ vars.PROD_SMOKE_FLAG_ID }}
          PROD_SMOKE_RUBRIC_FAMILY_ID: ${{ vars.PROD_SMOKE_RUBRIC_FAMILY_ID }}
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          PROD_SMOKE_DIST_DIR: ${{ github.workspace }}/frontend/dist
          MOBILE_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/veridical-mobile-smoke
        run: npm run test:production

      - name: Verify production bytes after the journey
        run: node tools/mobile-smoke/verify-deployment.mjs frontend/dist

      - name: Remove browser scratch output
        if: always()
        env:
          MOBILE_SMOKE_OUTPUT_DIR: ${{ runner.temp }}/veridical-mobile-smoke
        run: |
          target="$MOBILE_SMOKE_OUTPUT_DIR"
          case "$target" in
            "$RUNNER_TEMP/veridical-mobile-smoke") rm -rf -- "$target" ;;
            *)
              echo "Refusing to remove an unexpected scratch path" >&2
              exit 1
              ;;
          esac

      - name: Record the bounded result
        if: success()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/mobile-smoke/write-summary.mjs
