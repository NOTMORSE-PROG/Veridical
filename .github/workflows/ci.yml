name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veridical
          POSTGRES_PASSWORD: veridical
          POSTGRES_DB: veridical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridical -d veridical"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Tests (pytest)
        run: uv run pytest -v
        env:
          VERIDICAL_FAKE_LLM: "1"
          DATABASE_URL: postgresql://veridical:veridical@localhost:5432/veridical
