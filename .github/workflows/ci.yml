name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veridical
          POSTGRES_PASSWORD: veridical
          POSTGRES_DB: veridical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridical -d veridical"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # No floating major tag exists for setup-uv v8+ — pin the release SHA.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # `if: always()` on every check: a lint failure must NEVER hide the test
      # result. Eight pushes (V-018..V-026) went red on formatting alone, and
      # because pytest ran after it, the suite was silently skipped each time.
      - name: Lint (ruff)
        if: always()
        run: uv run ruff check .
      - name: Format check (ruff)
        if: always()
        run: uv run ruff format --check .
      - name: Acceptance classifier negative controls
        if: always()
        run: uv run python -m unittest discover -s ../tools -p test_backend_acceptance.py
      - name: Default pytest and source-correct backend acceptance
        if: always()
        run: uv run python ../tools/run_backend_acceptance.py --output-dir ../test-results/backend
        env:
          VERIDICAL_FAKE_LLM: "1"
          DATABASE_URL: postgresql://veridical:veridical@localhost:5432/veridical
          # conftest.py's skip-floor guard (BUG-076) defaults to 5. CI's real,
          # verified legitimate baseline is 9: 5 tests need a real Gemini key
          # (VERIDICAL_FAKE_LLM=1 here) and 4 need the owner's real proposal
          # PDF, which is local-only (D-007) and absent from this checkout.
          # Raised 8 -> 9 (BUG-048, run 32036317930): a new end-to-end
          # regression test needs BOTH that PDF and the owner's real TIP
          # rubric decomposition (context/golden/rubric_tip.json, also
          # local-only/gitignored) -- routes and executes all 11 real
          # criteria against the real manuscript extraction, which cannot
          # be faked without defeating the point of the test. Confirmed
          # 2026-08-17 -- do not raise further without checking which
          # specific tests are newly skipping and why.
          # Raised 9 -> 10 (BUG-146): a new known-answer test
          # (`test_checks_levels.py::test_match_level_known_answer_against_
          # the_real_rubric_pdf`) extracts `Rubric-for-Oral-Presentation.pdf`
          # -- BUG-146's own reproduction artifact, also local-only/
          # gitignored (D-007), same convention as `test_ingest_pdf.py`'s
          # existing `demo_pdf_only` marker already counted in the 9 above.
          VERIDICAL_MAX_SKIPS: "10"
      - name: Retain default pytest failure and acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-default-and-acceptance
          path: test-results/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Same rule as the backend job: every check reports, none masks another.
      - name: Lint (oxlint)
        if: always()
        run: npm run lint
      - name: Tests (vitest)
        if: always()
        run: npm test
      - name: Build (tsc + vite)
        if: always()
        run: npm run build
      - name: Token purge guard
        if: always()
        run: npm run check:css

  deploy-backend:
    # BUG-418: Render's own auto-deploy stopped firing (no backend deploy from
    # 2026-09-25 until a manual API deploy on 2026-10-13), and nothing noticed.
    # CI is now the single backend deploy path: after both checks pass on a push
    # to main, deploy the latest commit that touched backend/ if production is
    # not already serving it, then wait until /health reports that commit.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.PROD_API_URL || 'https://veridical-api.onrender.com' }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DEPLOY_TIMEOUT_SECONDS: ${{ vars.DEPLOY_TIMEOUT_SECONDS || '1500' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether production needs this backend commit
        id: decide
        # The target comes from main as it is NOW, never from the commit
        # that triggered this run, so re-running an
        # old CI run or two runs finishing out of order cannot roll production
        # back. A build with an identical backend/ tree counts as current.
        run: |
          [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ] || {
            echo "::error::RENDER_API_KEY secret or RENDER_SERVICE_ID variable is missing"
            exit 1
          }
          git fetch --quiet origin main
          target="$(git log -1 --format=%H origin/main -- backend)"
          live="$(curl -sS --retry 2 --retry-delay 10 --max-time 150 "$API_URL/health" | jq -r '.commit // empty' || true)"
          echo "latest backend commit on main: $target"
          echo "production serving:            ${live:-unknown}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          known() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "$live" = "$target" ] || { known "$live" && [ "$(git rev-parse "$live:backend")" = "$(git rev-parse "$target:backend")" ]; }; then
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          elif known "$live" && git merge-base --is-ancestor "$target" "$live"; then
            echo "::error::Production serves $live, which is ahead of main's latest backend commit and not on main. Not replacing it; check what deployed it."
            exit 1
          else
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy through the Render API
        if: steps.decide.outputs.deploy == 'yes'
        run: |
          target="${{ steps.decide.outputs.target }}"
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          resp="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$target\",\"clearCache\":\"do_not_clear\"}" "$api")"
          code="$(printf '%s\n' "$resp" | tail -n 1)"
          body="$(printf '%s\n' "$resp" | sed '$d')"
          case "$code" in
            200|201) deploy_id="$(printf '%s' "$body" | jq -r '.id // .deploy.id // empty')" ;;
            # Render documents 202 "Queued" with no body (a deploy is running).
            202) deploy_id="" ;;
            *)
              echo "::error::Render refused the deploy (HTTP $code): $(printf '%s' "$body" | jq -r '.message // empty' 2>/dev/null)"
              exit 1
              ;;
          esac
          if [ -z "$deploy_id" ]; then
            deploy_id="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "$api?limit=10" \
              | jq -r --arg c "$target" '[.[] | (.deploy // .) | select(.commit.id == $c)][0].id // empty')"
          fi
          [ -n "$deploy_id" ] || { echo "::error::Render answered HTTP $code but no deploy for $target was found"; exit 1; }
          echo "Render deploy $deploy_id for $target (HTTP $code)"
          deadline=$(( $(date +%s) + DEPLOY_TIMEOUT_SECONDS ))
          while :; do
            status="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" "$api/$deploy_id" \
              | jq -r '.status // .deploy.status // .message // empty' || true)"
            echo "status: ${status:-unknown}"
            case "$status" in
              live) break ;;
              *failed*|canceled|deactivated) echo "::error::Render deploy ended as $status"; exit 1 ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::Render deploy timed out"; exit 1; }
            sleep 20
          done
      - name: Verify production serves the backend commit
        run: |
          target="${{ steps.decide.outputs.target }}"
          known() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          for attempt in $(seq 1 20); do
            live="$(curl -sS --max-time 150 "$API_URL/health" | jq -r '.commit // empty' || true)"
            if [ "$live" = "$target" ] || { known "$live" && [ "$(git rev-parse "$live:backend")" = "$(git rev-parse "$target:backend")" ]; }; then
              echo "production serves ${live} (backend matches $target)"
              exit 0
            fi
            echo "attempt $attempt: production serves ${live:-unknown}"
            sleep 15
          done
          echo "::error::production does not serve the latest backend commit $target"
          exit 1
