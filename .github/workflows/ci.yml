name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veridical
          POSTGRES_PASSWORD: veridical
          POSTGRES_DB: veridical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridical -d veridical"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # No floating major tag exists for setup-uv v8+ — pin the release SHA.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # `if: always()` on every check: a lint failure must NEVER hide the test
      # result. Eight pushes (V-018..V-026) went red on formatting alone, and
      # because pytest ran after it, the suite was silently skipped each time.
      - name: Lint (ruff)
        if: always()
        run: uv run ruff check .
      - name: Format check (ruff)
        if: always()
        run: uv run ruff format --check .
      - name: Tests (pytest)
        if: always()
        run: uv run pytest -v
        env:
          VERIDICAL_FAKE_LLM: "1"
          DATABASE_URL: postgresql://veridical:veridical@localhost:5432/veridical
          # conftest.py's skip-floor guard (BUG-076) defaults to 5. CI's real,
          # verified legitimate baseline is 9: 5 tests need a real Gemini key
          # (VERIDICAL_FAKE_LLM=1 here) and 4 need the owner's real proposal
          # PDF, which is local-only (D-007) and absent from this checkout.
          # Raised 8 -> 9 (BUG-048, run 32036317930): a new end-to-end
          # regression test needs BOTH that PDF and the owner's real TIP
          # rubric decomposition (context/golden/rubric_tip.json, also
          # local-only/gitignored) -- routes and executes all 11 real
          # criteria against the real manuscript extraction, which cannot
          # be faked without defeating the point of the test. Confirmed
          # 2026-08-17 -- do not raise further without checking which
          # specific tests are newly skipping and why.
          # Raised 9 -> 10 (BUG-146): a new known-answer test
          # (`test_checks_levels.py::test_match_level_known_answer_against_
          # the_real_rubric_pdf`) extracts `Rubric-for-Oral-Presentation.pdf`
          # -- BUG-146's own reproduction artifact, also local-only/
          # gitignored (D-007), same convention as `test_ingest_pdf.py`'s
          # existing `demo_pdf_only` marker already counted in the 9 above.
          VERIDICAL_MAX_SKIPS: "10"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Same rule as the backend job: every check reports, none masks another.
      - name: Lint (oxlint)
        if: always()
        run: npm run lint
      - name: Tests (vitest)
        if: always()
        run: npm test
      - name: Build (tsc + vite)
        if: always()
        run: npm run build
      - name: Token purge guard
        if: always()
        run: npm run check:css
