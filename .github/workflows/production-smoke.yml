name: Production smoke test

# QA layer 2 (TESTING.md §7): proves the DEPLOY works, not just the code.
# NOT a keep-warm/uptime ping (that's V-043's decision to make, D-004) —
# this checks twice a day, far too sparse to prevent Render's 15-min
# idle spin-down. Dispatch manually when closing a ticket that reaches
# deployed code (TESTING.md DoD §4.11).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2,14 * * *" # twice daily, diagnostic only

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Config over hardcoding (charter rule 7): override via repo Settings
      # -> Actions -> Variables. Fallback is the current known-good URL
      # (V-048 evidence, 2026-07-22).
      API_URL: ${{ vars.PROD_API_URL || 'https://veridical-api.onrender.com' }}
      WEB_URL: ${{ vars.PROD_WEB_URL || 'https://veridical-app.vercel.app' }}
    steps:
      - name: Backend health (allows for cold start, ~43s measured worst case)
        run: |
          body="$(curl -sS --retry 2 --retry-delay 5 --max-time 60 "$API_URL/health")"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::Backend health check failed at $API_URL/health"
            exit 1
          }
      - name: Frontend reachable
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --max-time 60 "$WEB_URL")"
          echo "HTTP $code from $WEB_URL"
          [ "$code" = "200" ] || {
            echo "::error::Frontend not reachable at $WEB_URL (HTTP $code)"
            exit 1
          }
      - name: Frontend static assets serve as themselves, not index.html (BUG-003)
        # A vercel.json edit that moves the SPA catch-all into `routes`
        # (which has no filesystem-first check the way `rewrites` does)
        # makes every static asset resolve to index.html's HTML body
        # instead — the browser refuses to execute a <script type=module>
        # served as text/html, so the app never boots. This took prod down
        # for every user, 2026-08-12, caught only by a manual live curl,
        # not by anything in CI or this workflow. Same reasoning as the
        # health/reachable checks above: proves the DEPLOY behaves
        # correctly, which nothing at the code-review layer can see.
        run: |
          html="$(curl -sS --max-time 30 "$WEB_URL/")"
          js_path="$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)"
          [ -n "$js_path" ] || {
            echo "::error::Could not find a hashed JS asset path in $WEB_URL/'s HTML"
            exit 1
          }
          content_type="$(curl -sS -o /dev/null -w '%{content_type}' --max-time 30 "$WEB_URL$js_path")"
          echo "Content-Type for $js_path: $content_type"
          case "$content_type" in
            application/javascript*|text/javascript*) ;;
            *)
              echo "::error::$WEB_URL$js_path served as '$content_type', not JavaScript — vercel.json routing is almost certainly broken (see BUG-003)"
              exit 1
              ;;
          esac
