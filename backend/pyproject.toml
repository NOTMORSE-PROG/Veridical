[project]
name = "veridical-backend"
version = "0.1.0"
description = "VERIDICAL API — defense-readiness checks for capstone manuscripts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "google-genai>=1.0",
    # OWASP's first-choice password hashing algorithm (2026-07-25,
    # cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html).
    "argon2-cffi>=23.1",
    # stdlib zoneinfo has no data on Windows (and some minimal Linux images)
    # without this — needed for the quota governor's Pacific-midnight reset.
    "tzdata>=2025.1",
    # D-003: reuse validated NHST-extraction/p-recalc, never reimplement.
    # GPL-3.0 (PyPI name "statcheck", not "statcheck_python") — compatible
    # with VERIDICAL's own MIT license as an ordinary SaaS-runtime
    # dependency, never vendored; see DECISIONS.md D-022.
    "statcheck>=0.0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
